<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniForum - Inscription</title>
    <link rel="stylesheet" href="style.css">
</head>


<body>

        <h1>Bienvenue sur MiniForum</h1>

    <nav>
    <ul>
      <li><a href="index.html">Accueil</a></li>
      <li><a href="sujets.html">Sujets</a></li>
      <li><a href="connexion.html">Connexion</a></li>
    </ul>
    </nav>

    <main>
        <h2>Créer un compte</h2>

        <form action="/inscription" method="post">

            <fieldset>
                <legend>Identifiants</legend>

                <label for="pseudo">Pseudo</label>
                <input type="text" id="pseudo" name="pseudo" pattern="[A-Za-z0-9]{3,15}" title="Le pseudo doit contenir entre 3 et 15 lettres ou chiffres." required>

                <label for="email">Adresse e-mail</label>
                <input type="email" id="email" name="email" required>

                <label for="motdepasse">Mot de passe</label>
                <input type="password" id="motdepasse" name="motdepasse" minlength="8" required>

                <label for="naissance">Date de naissance</label>
                <input type="date" id="naissance" name="naissance" required>
            </fieldset>

            <fieldset>
                <legend>Préférences</legend>

                <label>
                    <input type="checkbox" name="newsletter">
                    Recevoir la lettre d'information
                </label>

                <label>
                    <input type="checkbox" name="cgu" required>
                    J'accepte les conditions d'utilisation
                </label>
            </fieldset>

            <button type="submit">Créer mon compte</button>

            <a href="connexion.html">Déjà inscrit ? Se connecter</a>

        </form>
    </main>

    <footer>
    <p>
        MiniForum-Projet du cours de développement web<br>
        Classe passerelle-cfpt-i
    </p>
    </footer>

</body>
</html>
